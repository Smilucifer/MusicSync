name: MusicSync

on:
  # schedule:
  #   - cron: '0 16,4 * * *'  # CST 0:00 and 12:00 (UTC 16:00 and 04:00)
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: 'Preview changes without executing'
      force_full_sync:
        type: boolean
        default: false
        description: 'Force full re-sync (ignore cache state)'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start NeteaseCloudMusicApi service
        run: |
          git clone https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced.git /tmp/netease-api
          cd /tmp/netease-api
          npm install
          node app.js &
          sleep 10
          curl -s http://localhost:3000/login/status || exit 1

      - name: Restore SQLite DB
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data/musicsync.db
          key: musicsync-db-${{ github.run_id }}
          restore-keys: musicsync-db-

      - name: Bootstrap DB from snapshot if missing
        run: |
          if [ ! -f data/musicsync.db ]; then
            python scripts/bootstrap_db_from_snapshot.py
          fi

      - name: Run sync
        env:
          NETEASE_MUSIC_U: ${{ secrets.NETEASE_MUSIC_U }}
          NETEASE_PHONE: ${{ secrets.NETEASE_PHONE }}
          NETEASE_MD5_PASSWORD: ${{ secrets.NETEASE_MD5_PASSWORD }}
          QQMUSIC_KEY: ${{ secrets.QQMUSIC_KEY }}
          QQMUSIC_UIN: ${{ secrets.QQMUSIC_UIN }}
          QQMUSIC_EUIN: ${{ secrets.QQMUSIC_EUIN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          FORCE_FULL_SYNC: ${{ github.event.inputs.force_full_sync || 'false' }}
          REVERSE_BATCH: '25'
        run: python scripts/sync.py

      - name: Save SQLite DB
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'
        uses: actions/cache/save@v4
        with:
          path: data/musicsync.db
          key: musicsync-db-${{ github.run_id }}

      - name: Commit snapshot CSV
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add csv/song_mappings_snapshot.csv
          if git diff --cached --quiet; then
            echo "no snapshot changes"
          else
            git commit -m "data: sync snapshot $(date -u +%FT%TZ)"
            git push
          fi
